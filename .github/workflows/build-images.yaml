# Build both app images, publish them to ECR, and propose a GitOps image-tag update.
name: Build and push AtlasOps images

# Run manually or when application/build inputs change on main.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".dockerignore"
      - ".github/workflows/build-images.yaml"

# Request an OIDC token for short-lived AWS credentials and read access for checkout.
permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Build ingestion and worker independently; one failure does not cancel the other build.
    strategy:
      fail-fast: false
      matrix:
        service:
          - ingestion
          - worker

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::483598626808:role/AtlasOps-dev-github-actions
          aws-region: us-east-1
          role-session-name: atlasops-build-${{ matrix.service }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SERVICE: ${{ matrix.service }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --platform linux/amd64 \
            -f "app/${SERVICE}/Dockerfile" \
            -t "${REGISTRY}/atlasops-dev-${SERVICE}:${IMAGE_TAG}" \
            .

      - name: Push Docker image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SERVICE: ${{ matrix.service }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="${REGISTRY}/atlasops-dev-${SERVICE}:${IMAGE_TAG}"
          docker push "$IMAGE"
          echo "### Published image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
  # Only after both images publish, open a PR updating the pinned Kubernetes image tags.
  update-manifests:
    name: Propose deployment update
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # This job needs repository and pull-request write access to propose the deployment PR.
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update image tags
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          registry = "483598626808.dkr.ecr.us-east-1.amazonaws.com"
          tag = os.environ["IMAGE_TAG"]

          for service in ("ingestion", "worker"):
              path = Path(f"kubernetes/base/{service}.yaml")
              repository = f"{registry}/atlasops-dev-{service}"

              pattern = (
                  r"(?m)^([ \t]*image:[ \t]*)"
                  + re.escape(repository)
                  + r":[^\s]+[ \t]*$"
              )

              updated, count = re.subn(
                  pattern,
                  lambda match: f"{match.group(1)}{repository}:{tag}",
                  path.read_text(),
              )

              if count != 1:
                  raise SystemExit(
                      f"Expected exactly one matching image in {path}; found {count}"
                  )

              path.write_text(updated)
              print(f"Updated {path} to {repository}:{tag}")
          PY

      - name: Create deployment pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: deploy/atlasops-${{ github.sha }}
          title: "Deploy AtlasOps images from ${{ github.sha }}"
          commit-message: "Update AtlasOps deployment image tags"
          body: |
            Updates ingestion and worker to images built successfully
            from commit ${{ github.sha }}.

            Review the image changes before merging.
            Argo CD will deploy the manifests after merge.
          add-paths: |
            kubernetes/base/ingestion.yaml
            kubernetes/base/worker.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: atlasops
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/azadehalimirzaie-dotcom/atlasops.git
    targetRevision: main
    path: kubernetes/base

  destination:
    server: https://kubernetes.default.svc
    namespace: atlasops

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
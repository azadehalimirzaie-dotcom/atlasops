apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default

  sources:
    # The monitoring Helm chart.
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: "92.11.0"
      helm:
        releaseName: monitoring
        valueFiles:
          - $values/kubernetes/monitoring/values.yaml

    # Your Helm values and the gp3 StorageClass.
    - repoURL: https://github.com/azadehalimirzaie-dotcom/atlasops.git
      targetRevision: main
      ref: values
      path: kubernetes/monitoring
      directory:
        include: storageclass.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
# Optional public HTTP ALB entry point; requires the AWS Load Balancer Controller.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingestion
  namespace: atlasops
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    # Route the load balancer directly to pod IP addresses.
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]' #ALB’s listener port: clients connect to the ALB on port 80.
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/success-codes: "200"
    # Restrict clients to this IPv4 CIDR; replace it with your current address before use.
    alb.ingress.kubernetes.io/inbound-cidrs: 46.128.143.64/32
spec:
  ingressClassName: alb
  # Forward all URL paths to port 80 of the ingestion ClusterIP Service.
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ingestion
                port:
                  number: 80 #Kubernetes Service port: identifies port 80 of the ingestion Service.
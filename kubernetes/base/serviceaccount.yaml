# Separate pod identities for ingestion and worker; the role ARNs must match Terraform outputs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ingestion
  namespace: atlasops
  annotations:
    # IRSA exchanges this service account token for temporary credentials for the annotated IAM role.
    eks.amazonaws.com/role-arn: arn:aws:iam::483598626808:role/AtlasOps-dev-ingestion
    # Use the regional STS endpoint when obtaining AWS credentials.
    eks.amazonaws.com/sts-regional-endpoints: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
  namespace: atlasops
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::483598626808:role/AtlasOps-dev-worker
    eks.amazonaws.com/sts-regional-endpoints: "true"
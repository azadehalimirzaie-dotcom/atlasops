apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
  namespace: atlasops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ingestion
  template:
    metadata:
      labels:
        app: ingestion
    spec:
      serviceAccountName: ingestion
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ingestion
          image: 483598626808.dkr.ecr.us-east-1.amazonaws.com/atlasops-dev-ingestion:f3def0ac522c848cd4966e0a2257209e913d2165
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: atlasops-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion
  namespace: atlasops
spec:
  type: ClusterIP
  selector:
    app: ingestion
  ports:
    - name: http
      port: 80
      targetPort: http
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ingestion
  namespace: atlasops
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - atlasops
  selector:
    matchLabels:
      app: ingestion
      purpose: metrics
  endpoints:
    - port: metrics
      path: /metrics/
      interval: 30s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: worker
  namespace: atlasops
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - atlasops
  selector:
    matchLabels:
      app: worker
      purpose: metrics
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
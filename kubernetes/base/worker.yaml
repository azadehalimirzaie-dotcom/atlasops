apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: atlasops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      serviceAccountName: worker
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: 483598626808.dkr.ecr.us-east-1.amazonaws.com/atlasops-dev-worker:c140dffbc3adbed6fe336e38c9aca5d595c158d9
          envFrom:
            - configMapRef:
                name: atlasops-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]